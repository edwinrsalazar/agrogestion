<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AgroGestión{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

<!-- VIDEO DE FONDO -->
<video autoplay muted loop class="video-fondo">
    <source src="{{ url_for('static', filename='img/video_2.mp4') }}" type="video/mp4">
</video>

<!-- HEADER -->
<header class="topbar">
    <h1>🌱 AGROGESTIÓN</h1>
</header>

<div class="panel">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <ul>
            <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('usuario.listar') }}">Usuarios</a></li>
            <li><a href="{{ url_for('cultivo.listar')}}">Cultivos</a></li>
            <li><a href="{{ url_for('inventario.listar')}}">Inventario</a></li>
            <li><a href="{{ url_for('actividades.listar')}}">Actividades</a></li>
            <li><a href="{{ url_for('produccion.listar') }}">Producción</a></li>
            <li><a href="{{ url_for('auth.logout') }}">Cerrar sesión</a></li>
        </ul>
    </aside>

    <!-- CONTENIDO -->
    <main class="contenido">
        <div class="contenedor-blanco">
            {% block content %}{% endblock %}
        </div>
    </main>

</div>

</body>
</html>
