{% extends "base.html" %}

{% block title %}Crear Producción{% endblock %}

{% block content %}

<style>
.form-container {
    width: 500px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 12px;
    color: white;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
}

.form-container h2 {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
}

.form-group input,
.form-group select {
    padding: 10px;
    border-radius: 6px;
    border: none;
}

.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.btn {
    flex: 1;
    padding: 12px;
    border-radius: 6px;
    border: none;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.btn-guardar {
    background-color: #2e7d32;
}

.btn-cancelar {
    background-color: #757575;
    text-align: center;
    text-decoration: none;
    line-height: 38px;
}
</style>

<div class="form-container">

    <h2>🌾 Registrar Producción</h2>

    <form method="POST">

        <!-- CULTIVO -->
        <div class="form-group">
            <label>Cultivo</label>
            <select name="cultivo_id" required>
                <option value="" disabled selected required>Seleccione un cultivo</option>
                {% for c in cultivos %}
                    <option value="{{ c.id_cultivos }}">{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- CANTIDAD -->
        <div class="form-group">
            <label>Cantidad</label>
            <input type="number" name="cantidad" required>
        </div>

        <!-- FECHA -->
        <div class="form-group">
            <label>Fecha</label>
            <input type="date" name="fecha" required>
        </div>

        <div class="btn-group">
            <button class="btn btn-guardar">Guardar</button>
            <a href="{{ url_for('produccion.listar') }}" class="btn btn-cancelar">Cancelar</a>
        </div>

    </form>

</div>

{% endblock %}
